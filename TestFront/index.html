<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AI agent 백엔드 테스트</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 50px auto;
        }
        h1 {
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 100px;
            font-size: 16px;
            padding: 10px;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        .answer {
            margin-top: 30px;
            padding: 15px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
            min-height: 50px;
        }
    </style>
</head>
<body>

<h1>AI agent 백엔드 테스트</h1>

<textarea id="question" placeholder="질문을 입력하세요"></textarea>
<br>
<button onclick="sendQuestion()">질문 보내기</button>

<div class="answer" id="answer">
    여기에 답변이 표시됩니다.
</div>

<script>
    async function sendQuestion() {
        const question = document.getElementById("question").value;
        const answerDiv = document.getElementById("answer");

        if (!question.trim()) {
            alert("질문을 입력하세요.");
            return;
        }

        answerDiv.textContent = "답변을 기다리는 중입니다...";

        try {
            const response = await fetch("http://localhost:8000/ask", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    question: question,
                    user_id:"jinu123",
                    tab_name:"주식가치평가",
                    company_name:"samsung"
                }),
            });

            if (!response.ok) {
                throw new Error("서버 오류");
            }

            const data = await response.json();
            answerDiv.textContent = data.answer;

        } catch (error) {
            answerDiv.textContent = "오류가 발생했습니다.";
            console.error(error);
        }
    }
</script>

</body>
</html>
